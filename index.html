  <body>
    <div id="root"></div>
    <script>
      // Восстанавливает исходный путь после редиректа из 404.html (см. public/404.html)
      (function () {
        var p = new URLSearchParams(window.location.search);
        if (p.has('p')) {
          var path = p.get('p') + (p.has('q') ? '?' + p.get('q').replace(/~and~/g, '&') : '') + window.location.hash;
          window.history.replaceState(null, '', path);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
